name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'index.js'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'presets.example.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1" > /dev/null
          echo "SDK : $ANDROID_HOME"

      - name: Cache nodejs-mobile
        id: libnode
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: android/app/libnode
          key: nodejs-mobile-v18.20.4-arm64-v8a

      - name: Fetch nodejs-mobile
        if: steps.libnode.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/nodejs-mobile.zip https://github.com/nodejs-mobile/nodejs-mobile/releases/download/v18.20.4/nodejs-mobile-v18.20.4-android.zip
          mkdir -p android/app/libnode
          unzip -q /tmp/nodejs-mobile.zip 'bin/arm64-v8a/*' 'include/*' -d android/app/libnode
          ls -la android/app/libnode/bin/arm64-v8a

      - name: Bundle the node project
        run: |
          rm -rf android/app/src/main/assets/nodejs-project
          mkdir -p android/app/src/main/assets/nodejs-project
          cp -r index.js src public package.json presets.example.json android/app/src/main/assets/nodejs-project/

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/keystore.p12
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "Pas de clé de signature : APK signé en debug"
          fi

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2 (v6 : nouvelles conditions de licence, non acceptées)
        with:
          gradle-version: '8.9'

      - name: Build the APK
        working-directory: android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          ARGS="-PversionCode=${{ github.run_number }} -PversionName=$(date +%Y.%m.%d).${{ github.run_number }}"
          if [ "$SIGNED" = "1" ]; then
            ARGS="$ARGS -PstoreFile=$PWD/keystore.p12 -PstorePassword=$STORE_PASSWORD -PkeyAlias=$KEY_ALIAS -PkeyPassword=$STORE_PASSWORD"
          fi
          gradle --no-daemon --console=plain assembleRelease $ARGS
          cp app/build/outputs/apk/release/app-release.apk ../blindtest.apk
          printf '{"versionCode": %s, "versionName": "%s", "sha": "%s"}\n' "${{ github.run_number }}" "$(date +%Y.%m.%d).${{ github.run_number }}" "$GITHUB_SHA" > ../version.json
          cat ../version.json
          ls -la ../blindtest.apk

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blindtest-apk
          path: blindtest.apk

      - name: Publish the release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: apk
          name: Blind Test — appli Android
          body: |
            APK construit automatiquement à chaque mise à jour du jeu. Sur Android, ouvre `blindtest.apk`, autorise l'installation, puis lance **Blind Test**.
            Une nouvelle version s'installe par-dessus l'ancienne. Le contenu du jeu se met aussi à jour tout seul au lancement.
          files: |
            blindtest.apk
            version.json
          make_latest: true
